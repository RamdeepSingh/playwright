name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: Cucumber tag expression
        default: "not @wip"
      browser:
        description: chromium | firefox | webkit
        default: chromium

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Playwright browser and OS dependencies
        run: mvn -B -q test-compile exec:java -Dexec.args="install --with-deps ${BROWSER}"

      - name: Run tests
        run: mvn -B test "-Dcucumber.filter.tags=${{ github.event.inputs.tags || 'not @wip' }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            target/cucumber-reports/
            target/allure-results/
            target/traces/
            target/surefire-reports/
