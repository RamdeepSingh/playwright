# Cucumber settings; any key can be overridden with -D<key>=<value> on the mvn command line.
cucumber.glue=com.uitap
cucumber.plugin=pretty,\
  html:target/cucumber-reports/cucumber.html,\
  json:target/cucumber-reports/cucumber.json,\
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
cucumber.filter.tags=not @wip

# Parallel scenario execution (each worker thread has its own browser, each scenario its own context)
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.parallel.config.fixed.max-pool-size=2
