# QA environment (default). Every key can be overridden with -D<key>=... or an env var
# named <KEY> with dots replaced by underscores (e.g. BASE_URL, BROWSER, HEADLESS).
base.url=http://uitestingplayground.com
browser=chromium
headless=true
slow.mo.ms=0
timeout.default.ms=15000
timeout.navigation.ms=30000
viewport.width=1366
viewport.height=768
trace.on.failure=true
video.enabled=false
