# Example second environment; point base.url at your own deployment of the playground
# (https://github.com/inflectra/ui-test-automation-playground). Run with -Denv=staging
base.url=http://localhost:3000
browser=chromium
headless=true
slow.mo.ms=0
timeout.default.ms=15000
timeout.navigation.ms=30000
viewport.width=1366
viewport.height=768
trace.on.failure=true
video.enabled=false
